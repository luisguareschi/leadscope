# Local Postgres stand-in. The hosted Supabase project, when created, is us-east-1.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: leadscope
      POSTGRES_PASSWORD: leadscope
      POSTGRES_DB: leadscope
    ports:
      - "5432:5432"
    volumes:
      - leadscope_pg:/var/lib/postgresql/data

volumes:
  leadscope_pg:
