<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sin conexión · LeadScope</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f2f3f7;
        --fg: #191c1f;
        --mute: #5f6470;
        --card: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #03040b;
          --fg: #f4f6fa;
          --mute: #969bad;
          --card: #12141f;
        }
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family:
          Inter,
          system-ui,
          -apple-system,
          sans-serif;
        background: var(--bg);
        color: var(--fg);
        text-align: center;
        padding: 24px;
      }
      main {
        background: var(--card);
        border-radius: 20px;
        padding: 40px 32px;
        max-width: 360px;
      }
      img {
        width: 64px;
        height: 64px;
        border-radius: 16px;
      }
      h1 {
        font-size: 20px;
        font-weight: 600;
        margin: 16px 0 8px;
      }
      p {
        font-size: 14px;
        line-height: 1.45;
        color: var(--mute);
        margin: 0 0 24px;
      }
      button {
        font: inherit;
        font-size: 14px;
        font-weight: 600;
        height: 40px;
        padding: 0 24px;
        border-radius: 9999px;
        border: 0;
        background: var(--fg);
        color: var(--bg);
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="" />
      <h1>Sin conexión</h1>
      <p>
        LeadScope necesita internet. Revisa tu conexión y vuelve a intentarlo.
      </p>
      <button onclick="location.reload()">Reintentar</button>
    </main>
  </body>
</html>
